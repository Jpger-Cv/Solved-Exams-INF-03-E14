                    <ul>

        <section id="prawy-pierwszy">
            <h1>Usługi kosmetyczne</h1>

        <section id="prawy-drugi">
            <h3>Kalkulator ceny wizyty</h3>
            <input type="checkbox" id="peeling">Peeling<br>
            <input type="checkbox" id="maska">Maska<br>
            <input type="checkbox" id="masaz">Masaż twarzy<br>
            <input type="checkbox" id="makijarz">Makijarz<br>
            <button onclick="obliczCene()">Oblicz cenę</button>
            <p id="obliczenia"></p>
        </section>

    <footer>

</body>
<script>
    function obliczCene() {
        let servicesArray = [document.getElementById('peeling').checked, document.getElementById('maska').checked, 
        document.getElementById('masaz').checked, document.getElementById('makijarz').checked];
        let valueArray = [45, 30, 20, 50];
        let sum = 0;
        for(let i=0; i<=servicesArray.length; i++){
            if (servicesArray[i]){
                sum += valueArray[i];
            }
        }
        document.getElementById('obliczenia').innerHTML = "Cena zabiegów: " + sum;
    }
</script>
